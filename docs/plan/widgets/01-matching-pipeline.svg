168" x2="434" y2="192"/><line class="grid" x1="530" y1="168" x2="530" y2="192"/><text class="th" x="50" y="212" dominant-baseline="central">BIT(48) AND → A가 8시간 · B가 8시간(밤샘) · 남는 4시간은 릴레이</text><rect class="box" x="50" y="222" width="576" height="24" rx="4" stroke-width="0.5"/><rect class="seg c-coral" x="50" y="222" width="144" height="24" rx="2" stroke-width="0.5"/><rect class="seg c-coral" x="578" y="222" width="48" height="24" rx="2" stroke-width="0.5"/><rect class="seg c-teal" x="362" y="222" width="192" height="24" rx="2" stroke-width="0.5"/><rect class="seg c-amber" x="266" y="222" width="96" height="24" rx="2" stroke-width="0.5"/><text class="ts" x="50" y="262" text-anchor="middle" dominant-baseline="central">00</text><text class="ts" x="146" y="262" text-anchor="middle" dominant-baseline="central">04</text><text class="ts" x="242" y="262" text-anchor="middle" dominant-baseline="central">08</text><text class="ts" x="338" y="262" text-anchor="middle" dominant-baseline="central">12</text><text class="ts" x="434" y="262" text-anchor="middle" dominant-baseline="central">16</text><text class="ts" x="530" y="262" text-anchor="middle" dominant-baseline="central">20</text><text class="ts" x="626" y="262" text-anchor="middle" dominant-baseline="central">24</text><text class="th" x="50" y="292" dominant-baseline="central">Stage 1 하드 필터 · H3 반경 1km + 필수 태그 10개 (Set Cover)</text><g class="c-red"><rect x="50" y="302" width="138" height="28" rx="8" stroke-width="0.5"/><text class="ts" x="119" y="316" text-anchor="middle" dominant-baseline="central">알레르기 대응</text></g><g class="c-red"><rect x="196" y="302" width="138" height="28" rx="8" stroke-width="0.5"/><text class="ts" x="265" y="316" text-anchor="middle" dominant-baseline="central">투약 관리</text></g><g class="c-red"><rect x="342" y="302" width="138" height="28" rx="8" stroke-width="0.5"/><text class="ts" x="411" y="316" text-anchor="middle" dominant-baseline="central">응급처치 이수</text></g><g class="c-red"><rect x="488" y="3