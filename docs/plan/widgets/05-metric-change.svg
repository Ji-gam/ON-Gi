<svg xmlns="http://www.w3.org/2000/svg" width="680" height="502" viewBox="0 0 680 502" role="img"><title>Precision@5를 피복률@5로 바꾼 이유</title><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}
.t{font-size:14px;fill:#191919}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#191919}
.box{fill:#FFFFFF;stroke:#B4B2A9}
.arr{stroke:#888780;fill:none;stroke-width:1.5}
.grid{stroke:#D3D1C7;stroke-width:0.5}
rect.seg.c-teal{fill:#9FE1CB}
rect.seg.c-coral{fill:#F5C4B3}
rect.seg.c-gray{fill:#D3D1C7}
rect.seg.c-amber{fill:#FAC775}
.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray>.th{fill:#444441}
.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple>.th{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}
.c-red>.th{fill:#791F1F}
.c-red>.ts{fill:#A32D2D}
.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber>.th{fill:#633806}
.c-amber>.ts{fill:#854F0B}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="502" fill="#FFFFFF"/><text class="th" x="50" y="44" dominant-baseline="central">제안 A · 상위 5명 중 3명이 &#39;성사 가능&#39; · Precision@5 = 60%</text><rect class="box" x="50" y="56" width="576" height="24" rx="4" stroke-width="0.5"/><rect class="seg c-amber" x="50" y="56" width="86" height="24" rx="2" stroke-width="0.5"/><rect class="seg c-amber" x="194" y="56" width="58" height="24" rx="2" stroke-width="0.5"/><rect class="seg c-amber" x="396" y="56" width="115" height="24" rx="2" stroke-width="0.5"/><text class="ts" x="50" y="94" dominant-baseline="central">조합하면 근무 시간의 45%만 덮인다 — 절반 이상이 빈 채로 남는다</text><text class="th" x="50" y="124" dominant-baseline="central">제안 B · 상위 5명 중 3명이 &#39;성사 가능&#39; · Precision@5 = 60%</text><rect class="box" x="50" y="136" width="576" height="24" rx="4" stroke-width="0.5"/><rect class="seg c-teal" x="50" y="136" width="259" height="24" rx="2" stroke-width="0.5"/><rect class="seg c-teal" x="321" y="136" width="271" height="24" rx="2" stroke-width="0.5"/><text class="ts" x="50" y="174" dominant-baseline="central">조합하면 92%가 덮인다 — 남는 건 짧은 한 구간뿐</text><line class="arr" x1="340" y1="190" x2="340" y2="210" marker-end="url(#arrow)"/><g class="c-red"><rect x="50" y="218" width="580" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="239" text-anchor="middle" dominant-baseline="central">같은 점수, 전혀 다른 현실</text><text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">맞힌 사람 수만 세면 45%와 92%가 동점이 된다</text></g><g class="c-gray"><rect x="50" y="306" width="180" height="76" rx="8" stroke-width="0.5"/><text class="th" x="140" y="325" text-anchor="middle" dominant-baseline="central">릴레이는 조합이다</text><text class="ts" x="140" y="344" text-anchor="middle" dominant-baseline="central">순위 지표가 안 맞는다</text><text class="ts" x="140" y="363" text-anchor="middle" dominant-baseline="central">누가 아니라 무엇을 덮나</text></g><g class="c-gray"><rect x="250" y="306" width="180" height="76" rx="8" stroke-width="0.5"/><text class="th" x="340" y="325" text-anchor="middle" dominant-baseline="central">정도를 못 잰다</text><text class="ts" x="340" y="344" text-anchor="middle" dominant-baseline="central">맞았나 틀렸나 둘뿐</text><text class="ts" x="340" y="363" text-anchor="middle" dominant-baseline="central">45%와 92%가 동점</text></g><g class="c-gray"><rect x="450" y="306" width="180" height="76" rx="8" stroke-width="0.5"/><text class="th" x="540" y="325" text-anchor="middle" dominant-baseline="central">호혜가 안 보인다</text><text class="ts" x="540" y="344" text-anchor="middle" dominant-baseline="central">받기만 해도 만점</text><text class="ts" x="540" y="363" text-anchor="middle" dominant-baseline="central">관계 지속을 못 본다</text></g><g class="c-teal"><rect x="50" y="396" width="580" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="417" text-anchor="middle" dominant-baseline="central">새 지표 — 피복률@5 와 호혜 충족률을 함께</text><text class="ts" x="340" y="438" text-anchor="middle" dominant-baseline="central">얼마나 덮었는가, 그리고 그만큼 되갚을 수 있는가</text></g><circle class="c-teal" cx="62" cy="480" r="5" stroke-width="0.5"/><text class="ts" x="74" y="480" dominant-baseline="central">덮인 시간</text><circle class="c-amber" cx="164" cy="480" r="5" stroke-width="0.5"/><text class="ts" x="176" y="480" dominant-baseline="central">덮였지만 부족</text><circle class="c-red" cx="290" cy="480" r="5" stroke-width="0.5"/><text class="ts" x="302" y="480" dominant-baseline="central">지표의 결함</text></svg>