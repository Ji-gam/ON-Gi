<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img"><title>지표를 바꾸자 순위가 뒤집혔다 — 실측값 비교</title><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}
