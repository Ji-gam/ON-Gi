.c-amber>.ts{fill:#854F0B}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/><text class="th" x="175" y="56" text-anchor="middle" dominant-baseline="central">Precision@5 · 옛 지표</text><text class="th" x="505" y="56" text-anchor="middle" dominant-baseline="central">피복률@5 · 새 지표</text><g class="c-amber"><rect x="50" y="80" width="250" height="36" rx="4" stroke-width="0.5"/><text class="th" x="66" y="98" dominant-baseline="central">1</text><text class="th" x="90" y="98" dominant-baseline="central">M 상보성만</text><text class="th" x="284" y="98" text-anchor="end" dominant-baseline="central">78.0%</text></g><g class="c-gray"><rect x="50" y="124" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="66" y="142" dominant-baseline="central">2</text><text class="ts" x="90" y="142" dominant-baseline="central">S 콜드스타트</text><text class="ts" x="284" y="142" text-anchor="end" dominant-baseline="central">71.5%</text></g><g class="c-gray"><rect x="50" y="168" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="66" y="186" dominant-baseline="central">3</text><text class="ts" x="90" y="186" dominant-baseline="central">B3 한 방향 피복</text><text class="ts" x="284" y="186" text-anchor="end" dominant-baseline="central">63.4%</text></g><g class="c-gray"><rect x="50" y="212" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="66" y="230" dominant-baseline="central">4</text><text class="ts" x="90" y="230" dominant-baseline="central">S 전체 가중치</text><text class="ts" x="284" y="230" text-anchor="end" dominant-baseline="central">54.8%</text></g><g class="c-gray"><rect x="50" y="256" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="66" y="274" dominant-baseline="central">5</text><text class="ts" x="90" y="274" dominant-baseline="central">B0 무작위</text><text class="ts" x="284" y="274" text-anchor="end" dominant-baseline="central">16.6%</text></g><g class="c-gray"><rect x="50" y="300" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="66" y="318" dominant-baseline="central">6</text><text class="ts" x="90" y="318" dominant-baseline="central">B2 단순 시간 겹침</text><text class="ts" x="284" y="318" text-anchor="end" dominant-baseline="central">0.5%</text></g><g class="c-teal"><rect x="50" y="344" width="250" height="36" rx="4" stroke-width="0.5"/><text class="th" x="66" y="362" dominant-baseline="central">—</text><text class="th" x="90" y="362" dominant-baseline="central">조합 인지 선정</text><text class="th" x="284" y="362" text-anchor="end" dominant-baseline="central">측정 불가</text></g><g class="c-teal"><rect x="380" y="80" width="250" height="36" rx="4" stroke-width="0.5"/><text class="th" x="396" y="98" dominant-baseline="central">1</text><text class="th" x="420" y="98" dominant-baseline="central">조합 인지 선정</text><text class="th" x="614" y="98" text-anchor="end" dominant-baseline="central">78.6%</text></g><g class="c-gray"><rect x="380" y="124" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="396" y="142" dominant-baseline="central">2</text><text class="ts" x="420" y="142" dominant-baseline="central">S 전체 가중치</text><text class="ts" x="614" y="142" text-anchor="end" dominant-baseline="central">76.8%</text></g><g class="c-gray"><rect x="380" y="168" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="396" y="186" dominant-baseline="central">3</text><text class="ts" x="420" y="186" dominant-baseline="central">B3 한 방향 피복</text><text class="ts" x="614" y="186" text-anchor="end" dominant-baseline="central">70.2%</text></g><g class="c-gray"><rect x="380" y="212" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="396" y="230" dominant-baseline="central">4</text><text class="ts" x="420" y="230" dominant-baseline="central">B0 무작위</text><text class="ts" x="614" y="230" text-anchor="end" dominant-baseline="central">69.8%</text></g><g class="c-gray"><rect x="380" y="256" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="396" y="274" dominant-baseline="central">5</text><text class="ts" x="420" y="274" dominant-baseline="central">S 콜드스타트</text><text class="ts" x="614" y="274" text-anchor="end" dominant-baseline="central">69.7%</text></g><g class="c-amber"><rect x="380" y="300" width="250" height="36" rx="4" stroke-width="0.5"/><text class="th" x="396" y="318" dominant-baseline="central">6</text><text class="th" x="420" y="318" dominant-baseline="central">M 상보성만</text><text class="th" x="614" y="318" text-anchor="end" dominant-baseline="central">67.1%</text></g><g class="c-gray"><rect x="380" y="344" width="250" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="396" y="362" dominant-baseline="central">7</text><text class="ts" x="420" y="362" dominant-baseline="central">B2 단순 시간 겹침</text><text class="ts" x="614" y="362" text-anchor="end" dominant-baseline="central">25.4%</text></g><path d="M304 98 L340 98 L340 318 L376 318" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304 362 L352 362 L352 98 L376 98" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/><g class="c-red"><rect x="50" y="404" width="580" height="76" rx="8" stroke-width="0.5"/><text class="th" x="340" y="423" text-anchor="middle" dominant-baseline="central">같은 방법이 1위에서 6위로 — 지표가 결론을 바꾼다</text><text class="ts" x="340" y="442" text-anchor="middle" dominant-baseline="central">M은 상위 5명이 서로 중복돼 조합하면 못 덮는데, 옛 지표는 그걸 못 본다</text><text class="ts" x="340" y="461" text-anchor="middle" dominant-baseline="central">조합 인지 선정은 순위를 안 내놓아 옛 지표로는 측정 자체가 안 된다</text></g></svg>