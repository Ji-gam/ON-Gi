<svg xmlns="http://www.w3.org/2000/svg" width="680" height="406" viewBox="0 0 680 406" role="img"><title>H1-a 개정 이력 — v1에서 v3까지</title><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}
.t{font-size:14px;fill:#191919}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#191919}
.box{fill:#FFFFFF;stroke:#B4B2A9}
.arr{stroke:#888780;fill:none;stroke-width:1.5}
.grid{stroke:#D3D1C7;stroke-width:0.5}
rect.seg.c-teal{fill:#9FE1CB}
rect.seg.c-coral{fill:#F5C4B3}
rect.seg.c-gray{fill:#D3D1C7}
.c-gray>rect,.c-gray>circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray>.th{fill:#444441}
.c-gray>.ts{fill:#5F5E5A}
.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal>.th{fill:#085041}
.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D}
.c-coral>.th{fill:#712B13}
.c-coral>.ts{fill:#993C1D}
.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple>.th{fill:#3C3489}
.c-purple>.ts{fill:#534AB7}
.c-red>rect,.c-red>circle,rect.c-red,circle.c-red{fill:#FCEBEB;stroke:#A32D2D}
.c-red>.th{fill:#791F1F}
.c-red>.ts{fill:#A32D2D}
.c-amber>rect,.c-amber>circle,rect.c-amber,circle.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber>.th{fill:#633806}
.c-amber>.ts{fill:#854F0B}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="406" fill="#FFFFFF"/><g class="c-gray"><rect x="50" y="40" width="580" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">H1-a (v1) — 두 주장이 &#39;그리고&#39;로 묶여 있었다</text><text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">㈎ 1km 안 밀도가 충분하다 · ㈏ 공공 돌봄에 대기가 쌓여 있다</text></g><line class="arr" x1="190" y1="96" x2="190" y2="110" marker-end="url(#arrow)"/><line class="arr" x1="490" y1="96" x2="490" y2="110" marker-end="url(#arrow)"/><g class="c-amber"><rect x="50" y="116" width="280" height="76" rx="8" stroke-width="0.5"/><text class="th" x="190" y="135" text-anchor="middle" dominant-baseline="central">㈎ 밀도 — 미해결</text><text class="ts" x="190" y="154" text-anchor="middle" dominant-baseline="central">어린이집 좌표·현원 필요</text><text class="ts" x="190" y="173" text-anchor="middle" dominant-baseline="central">승인 대기 중</text></g><g class="c-teal"><rect x="350" y="116" width="280" height="76" rx="8" stroke-width="0.5"/><text class="th" x="490" y="135" text-anchor="middle" dominant-baseline="central">㈏ 수요 — 닫힘</text><text class="ts" x="490" y="154" text-anchor="middle" dominant-baseline="central">대기 42번 중 41번 증가</text><text class="ts" x="490" y="173" text-anchor="middle" dominant-baseline="central">가용 18,722명 있는데도</text></g><line class="arr" x1="490" y1="192" x2="490" y2="206" marker-end="url(#arrow)"/><g class="c-purple"><rect x="50" y="212" width="580" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="230" text-anchor="middle" dominant-baseline="central">v2 — 반증 가능한 문장으로 고쳐 썼다</text><text class="ts" x="340" y="248" text-anchor="middle" dominant-baseline="central">&#39;대기가 있다&#39;는 통계상 항상 참 · &#39;인력 부족이 아니다&#39;는 틀릴 수 있다</text></g><line class="arr" x1="340" y1="268" x2="340" y2="282" marker-end="url(#arrow)"/><g class="c-purple"><rect x="50" y="288" width="580" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="309" text-anchor="middle" dominant-baseline="central">H1-a (v3) — 시장 명제에서 기술 명제로</text><text class="ts" x="340" y="330" text-anchor="middle" dominant-baseline="central">공공데이터는 입력 조건, 검증 대상은 세 축 매칭 대 베이스라인</text></g><circle class="c-teal" cx="62" cy="384" r="5" stroke-width="0.5"/><text class="ts" x="74" y="384" dominant-baseline="central">닫힘</text><circle class="c-amber" cx="140" cy="384" r="5" stroke-width="0.5"/><text class="ts" x="152" y="384" dominant-baseline="central">진행 중</text><circle class="c-purple" cx="232" cy="384" r="5" stroke-width="0.5"/><text class="ts" x="244" y="384" dominant-baseline="central">가설 문장</text><circle class="c-gray" cx="330" cy="384" r="5" stroke-width="0.5"/><text class="ts" x="342" y="384" dominant-baseline="central">이전 버전</text></svg>