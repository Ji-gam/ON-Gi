.c-amber>.ts{fill:#854F0B}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/><text class="th" x="210" y="56" text-anchor="end" dominant-baseline="central">B2 단순 시간 겹침</text><g class="c-red"><rect x="220" y="40" width="2" height="32" rx="2" stroke-width="0.5"/></g><text class="ts" x="236" y="56" dominant-baseline="central">0.5%  — 무작위보다 낮다</text><text class="th" x="210" y="104" text-anchor="end" dominant-baseline="central">B0 무작위</text><g class="c-gray"><rect x="220" y="88" width="60" height="32" rx="2" stroke-width="0.5"/></g><text class="ts" x="294" y="104" dominant-baseline="central">16.6%</text><text class="th" x="210" y="152" text-anchor="end" dominant-baseline="central">S 전체 가중치</text><g class="c-amber"><rect x="220" y="136" width="197" height="32" rx="2" stroke-width="0.5"/></g><text class="ts" x="431" y="152" dominant-baseline="central">54.8%</text><text class="th" x="210" y="200" text-anchor="end" dominant-baseline="central">B3 한 방향 피복</text><g class="c-gray"><rect x="220" y="184" width="228" height="32" rx="2" stroke-width="0.5"/></g><text class="ts" x="462" y="200" dominant-baseline="central">63.4%  ← 정식 베이스라인</text><text class="th" x="210" y="248" text-anchor="end" dominant-baseline="central">M 상보성 양방향</text><g class="c-teal"><rect x="220" y="232" width="281" height="32" rx="2" stroke-width="0.5"/></g><text class="ts" x="515" y="248" dominant-baseline="central">78.0%  ← 우리 방식</text><line x1="220" y1="278" x2="580" y2="278" stroke="#888780" stroke-width="0.5"/><text class="ts" x="220" y="294" text-anchor="middle" dominant-baseline="central">0</text><text class="ts" x="400" y="294" text-anchor="middle" dominant-baseline="central">50%</text><text class="ts" x="580" y="294" text-anchor="middle" dominant-baseline="central">100%</text><g class="c-amber"><rect x="50" y="318" width="580" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="339" text-anchor="middle" dominant-baseline="central">판정 — B3 대비 +14.6%p · 목표 15%p에 근소 미달</text><text class="ts" x="340" y="360" text-anchor="middle" dominant-baseline="central">B2 대비 +77.5%p는 의미 없다. 무작위보다 나쁜 방식을 이긴 것뿐이다</text></g><g class="c-gray"><rect x="50" y="394" width="580" height="64" rx="8" stroke-width="0.5"/><text class="th" x="340" y="415" text-anchor="middle" dominant-baseline="central">S 전체가 M보다 낮은 이유 — 콜드스타트</text><text class="ts" x="340" y="436" text-anchor="middle" dominant-baseline="central">신규 가입자는 평판·호혜 이력이 없어 가치관이 상보성보다 1.4배 세진다</text></g></svg>