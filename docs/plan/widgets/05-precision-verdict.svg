<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>Precision@5 베이스라인 비교와 성공 기준 판정</title><style>text{font-family:'Malgun Gothic','Segoe UI',sans-serif}
