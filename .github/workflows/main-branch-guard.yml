name: Guard main branch
on:
  pull_request:
    branches: [main]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: head 브랜치가 release 계열인지 확인
        run: |
          case "${{ github.head_ref }}" in
            release|release/*|Release|Release/*) ;;
            *)
              echo "main으로의 PR은 release 또는 release/* 브랜치에서만 가능합니다. (head: ${{ github.head_ref }})"
              exit 1
              ;;
          esac
